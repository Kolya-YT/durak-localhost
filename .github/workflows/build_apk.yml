name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/build_apk.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GODOT_VERSION: "4.4.1"
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      GODOT_HOME: ${{ github.workspace }}/.godot-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot headless executable and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GODOT_HOME}/bin" "${GODOT_HOME}/templates"
          GODOT_BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 \
            "${GODOT_BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "${GODOT_HOME}/bin"
          GODOT_BIN="$(find "${GODOT_HOME}/bin" -type f -name 'Godot_v*-linux.x86_64' -print -quit)"
          if [ -z "${GODOT_BIN}" ]; then
            echo "Godot executable was not found in the downloaded archive." >&2
            exit 1
          fi
          chmod +x "${GODOT_BIN}"
          echo "GODOT_BIN=${GODOT_BIN}" >> "${GITHUB_ENV}"
          curl --fail --location --retry 3 \
            "${GODOT_BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d "${GODOT_HOME}/templates"
          TEMPLATE_DIR="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${TEMPLATE_DIR}"
          cp -a "${GODOT_HOME}/templates/templates/." "${TEMPLATE_DIR}/"
          "${GODOT_BIN}" --version

      - name: Configure Android SDK paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Create debug signing keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.android"
          keytool -genkeypair -v \
            -keystore "${HOME}/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          echo "GODOT_DEBUG_KEYSTORE=${HOME}/.android/debug.keystore" >> "${GITHUB_ENV}"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --editor --path . --import

      - name: Check required main scene
        shell: bash
        run: |
          if [ ! -f "scenes/main.tscn" ]; then
            echo "::error::scenes/main.tscn is missing. Complete the game scenes stage before expecting a successful APK build."
            exit 1
          fi

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "${GODOT_BIN}" --headless --path . \
            --export-debug "Android" "build/durak-lan-debug.apk"
          test -s "build/durak-lan-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: durak-lan-debug-apk
          path: build/durak-lan-debug.apk
          if-no-files-found: error
          retention-days: 14
